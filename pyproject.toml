[project]
name = "auto-test-tool"
version = "0.1.0"
description = "Smart instrument testing system for controlling and monitoring electronic measurement devices"
authors = [
    { name = "Sandman Zhang", email = "zbnsandman@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pyvisa>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smart_instrument", "smart_instrument.*"]
namespaces = false

[project.scripts]
smart_instrument = "smart_instrument.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "nuitka>=4.0.5",
    "pyinstaller>=6.19.0",
    "zstandard>=0.23.0",
]
