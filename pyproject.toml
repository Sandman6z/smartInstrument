[project]
name = "auto-test-tool"
version = "0.1.0"
description = "Smart instrument testing system for controlling and monitoring electronic measurement devices"
authors = [
    { name = "Sandman Zhang", email = "zbnsandman@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pyvisa>=1.14.0",
    "openpyxl>=3.1.0",
    "Flask>=2.0.1",
    "Flask-CORS>=3.0.10",
    "Flask-SocketIO>=5.1.1",
    "python-socketio>=5.7.2"
]

[tool.setuptools]
packages = ["smart_instrument"]

[tool.setuptools.package-dir]
smart_instrument = "src/smart_instrument"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv configuration

