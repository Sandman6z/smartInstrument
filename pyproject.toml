[project]
name = "auto-test-tool"
version = "0.1.0"
description = "Smart instrument testing system for controlling and monitoring electronic measurement devices"
authors = [
    { name = "Sandman Zhang", email = "zbnsandman@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pyvisa>=1.14.1",
    "openpyxl>=3.1.5",
]

[tool.setuptools]
packages = ["smart_instrument"]

[tool.setuptools.package-dir]
smart_instrument = "src/smart_instrument"

[project.scripts]
smart_instrument = "smart_instrument.__main__:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "nuitka>=4.0.8",
    "pyinstaller>=6.19.0",
    "zstandard>=0.25.0",
]
